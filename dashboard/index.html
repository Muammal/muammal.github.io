<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Muammal Portfolio</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#080808">

  <!-- Google Fonts: Geist & Geist Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="../styles.css">
  <script src="../api-config.js"></script>

  <style>
    .dashboard-viewport {
      min-height: 100vh;
      padding-bottom: 5rem;
    }

    .dash-header {
      padding: var(--space-4) 0;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--nav-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .dash-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .dash-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .dash-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: var(--space-4);
      margin: var(--space-7) 0 var(--space-8);
    }

    .metric-card {
      padding: 1.5rem;
      border-radius: var(--r-md);
      display: grid;
      gap: 0.4rem;
    }

    .metric-value {
      font-size: 2rem;
      font-weight: 500;
      color: var(--fg);
      letter-spacing: -0.03em;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
      margin-right: 0.4rem;
    }

    .dash-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-4);
    }

    .project-edit-card {
      padding: 1.75rem;
      border-radius: var(--r-lg);
      margin-bottom: var(--space-5);
      display: grid;
      gap: var(--space-4);
    }

    .project-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.65rem;
      border-radius: var(--r-pill);
      font-size: var(--fs-xs);
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-status.published {
      background: rgba(34, 197, 94, 0.15);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .badge-status.draft {
      background: rgba(245, 158, 11, 0.15);
      color: #fde047;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 100;
      padding: 0.85rem 1.4rem;
      border-radius: var(--r-sm);
      background: #18181b;
      border: 1px solid var(--line-strong);
      color: #fff;
      font-size: var(--fs-sm);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

<body>
  <!-- Ambient background lighting -->
  <div class="ambient" aria-hidden="true">
    <div class="ambient__orb ambient__orb--a"></div>
    <div class="ambient__orb ambient__orb--b"></div>
  </div>

  <div class="dashboard-viewport" id="dashboardApp" style="display: none;">
    <header class="dash-header">
      <div class="container dash-nav">
        <div class="dash-brand">
          <span class="nav__mark" aria-hidden="true">MF</span>
          <div>
            <h1 style="font-size: 1rem; font-weight: 500; color: var(--fg);">Control Dashboard</h1>
            <p class="mono" id="adminUserLabel" style="font-size: 0.65rem;">Logged in as admin</p>
          </div>
        </div>

        <div class="dash-actions">
          <a href="../" class="btn btn--glass" style="min-height: 2.25rem; font-size: var(--fs-xs);">
            <span>View Public Site</span>
          </a>
          <button type="button" class="btn btn--primary" id="logoutBtn"
            style="min-height: 2.25rem; font-size: var(--fs-xs); background: #ef4444; color: #fff;">
            <span>Sign Out</span>
          </button>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="overview-grid">
        <div class="metric-card glass">
          <span class="mono">Total Projects</span>
          <div class="metric-value" id="metricTotal">-</div>
        </div>
        <div class="metric-card glass">
          <span class="mono">Published</span>
          <div class="metric-value" id="metricPublished">-</div>
        </div>
        <div class="metric-card glass">
          <span class="mono">API Status</span>
          <div class="metric-value" style="font-size: 1.25rem; display: flex; align-items: center; margin-top: 0.25rem;">
            <span class="status-dot"></span> Live
          </div>
        </div>
        <div class="metric-card glass">
          <span class="mono">Auth Protocol</span>
          <div class="metric-value" style="font-size: 1.25rem; margin-top: 0.25rem;">
            Argon2id
          </div>
        </div>
      </section>

      <section>
        <div class="dash-section-head">
          <div>
            <h2 class="display-2" style="font-size: 1.75rem;">Manage Portfolio Projects</h2>
            <p class="mono" style="margin-top: 0.2rem;">Live updates reflect across public endpoints</p>
          </div>
        </div>

        <div id="projectsContainer">
          <p class="mono" style="padding: 2rem 0;">Loading projects...</p>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toastMessage"></div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const app = document.getElementById('dashboardApp');
      const toast = document.getElementById('toastMessage');
      const logoutBtn = document.getElementById('logoutBtn');
      const adminLabel = document.getElementById('adminUserLabel');

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
      }

      // 1. Verify Authentication
      let currentUser = null;
      try {
        const authData = await window.API_CONFIG.fetchAPI('/api/auth/me');
        if (!authData || !authData.authenticated) {
          throw new Error('Not authenticated');
        }
        currentUser = authData.user;
        adminLabel.textContent = `Administrator: ${currentUser.username}`;
        app.style.display = 'block';
      } catch (err) {
        window.location.href = '../login/';
        return;
      }

      // 2. Logout handler
      logoutBtn.addEventListener('click', async () => {
        try {
          await window.API_CONFIG.fetchAPI('/api/auth/logout', { method: 'POST' });
        } catch (e) {}
        window.API_CONFIG.setToken('');
        window.location.href = '../login/';
      });

      // 3. Load Projects
      async function loadProjects() {
        const container = document.getElementById('projectsContainer');
        try {
          const res = await window.API_CONFIG.fetchAPI('/api/admin/projects');
          const projects = res.projects || [];

          document.getElementById('metricTotal').textContent = projects.length;
          document.getElementById('metricPublished').textContent = projects.filter(p => p.is_published).length;

          if (projects.length === 0) {
            container.innerHTML = '<p class="mono">No projects found.</p>';
            return;
          }

          container.innerHTML = projects.map(p => `
            <div class="project-edit-card glass spotlight" data-id="${p.id}">
              <div class="project-header-row">
                <div>
                  <span class="mono">#0${p.display_order || p.id} · ${p.badge}</span>
                  <h3 style="font-size: 1.35rem; color: var(--fg); margin-top: 0.2rem;">${p.title}</h3>
                </div>
                <span class="badge-status ${p.is_published ? 'published' : 'draft'}">
                  ${p.is_published ? '● Live Published' : '○ Draft Hidden'}
                </span>
              </div>

              <div class="field" style="margin-top: 0.5rem;">
                <label>Description</label>
                <textarea class="field__input field__textarea p-desc" rows="3">${p.description}</textarea>
              </div>

              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-4);">
                <div class="field">
                  <label>External Destination URL</label>
                  <input type="text" class="field__input p-link" value="${p.link_url || ''}" placeholder="https://...">
                </div>

                <div class="field">
                  <label>Visibility Status</label>
                  <select class="field__input p-status" style="background: var(--input-bg); color: var(--fg);">
                    <option value="1" ${p.is_published ? 'selected' : ''}>Published (Visible)</option>
                    <option value="0" ${!p.is_published ? 'selected' : ''}>Draft (Hidden)</option>
                  </select>
                </div>
              </div>

              <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 0.5rem;">
                <button type="button" class="btn btn--primary save-btn" data-id="${p.id}" style="min-height: 2.4rem;">
                  <span>Save Changes</span>
                </button>
              </div>
            </div>
          `).join('');

          // Attach save handlers
          container.querySelectorAll('.save-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
              const id = btn.getAttribute('data-id');
              const card = btn.closest('.project-edit-card');
              const desc = card.querySelector('.p-desc').value.trim();
              const link = card.querySelector('.p-link').value.trim();
              const isPublished = card.querySelector('.p-status').value === '1';

              btn.disabled = true;
              btn.innerHTML = '<span>Saving...</span>';

              try {
                await window.API_CONFIG.fetchAPI(`/api/admin/projects/${id}`, {
                  method: 'PUT',
                  body: JSON.stringify({
                    description: desc,
                    link_url: link,
                    is_published: isPublished
                  })
                });
                showToast(`Project updated successfully.`);
                btn.innerHTML = '<span>Saved ✓</span>';
                setTimeout(() => {
                  btn.disabled = false;
                  btn.innerHTML = '<span>Save Changes</span>';
                  loadProjects();
                }, 1000);
              } catch (e) {
                showToast(`Update error: ${e.message}`);
                btn.disabled = false;
                btn.innerHTML = '<span>Retry</span>';
              }
            });
          });

        } catch (e) {
          container.innerHTML = `<p class="mono" style="color: #f87171;">Failed to load projects: ${e.message}</p>`;
        }
      }

      loadProjects();
    });
  </script>
</body>

</html>
